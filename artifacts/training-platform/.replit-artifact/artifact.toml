kind = "web"
previewPath = "/"
title = "VA Training Exam Platform"
version = "1.0.0"
id = "artifacts/training-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19495

[services.development]
run = "pnpm --filter @workspace/training-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/training-platform", "run", "build" ]
publicDir = "artifacts/training-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19495"
BASE_PATH = "/"
