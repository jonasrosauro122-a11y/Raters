<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam — VA Training Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="bg-animated"></div>
  <canvas id="particles-canvas"></canvas>
  <div class="scanlines"></div>

  <!-- ─── EXAM HEADER ─── -->
  <div class="exam-header" id="exam-header">
    <div class="flex items-center gap-3">
      <a href="index.html" class="btn btn-ghost btn-sm" id="btn-exit" title="Exit exam">← Exit</a>
      <div class="exam-header-info">
        <div class="exam-header-title" id="hdr-exam-title">Loading exam…</div>
        <div class="exam-header-meta" id="hdr-exam-meta"></div>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <!-- Timer ring container -->
      <div id="timer-ring-container" style="position:relative;width:48px;height:48px"></div>
      <div class="timer-container">
        <span class="timer-icon">⏱</span>
        <span class="timer-display" id="timer-display">--:--</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <span id="hdr-progress" style="font-size:0.8rem;color:var(--text-muted)"></span>
      <button class="btn btn-danger btn-sm" id="btn-submit-top">Submit Exam</button>
    </div>
  </div>

  <!-- ─── EXAM LAYOUT ─── -->
  <div class="exam-layout" id="exam-layout" style="display:none">

    <!-- MAIN QUESTION AREA -->
    <div class="exam-main">
      <div id="question-container"></div>

      <!-- NAVIGATION -->
      <div class="flex items-center justify-between gap-3 mt-6">
        <div class="flex items-center gap-2">
          <button class="btn btn-ghost" id="btn-prev" disabled>← Prev</button>
          <button class="btn btn-secondary" id="btn-flag">🚩 Flag</button>
          <button class="btn btn-ghost btn-sm" id="btn-clear">Clear</button>
        </div>
        <div id="keyboard-hints" style="font-size:0.75rem;color:var(--text-muted)">
          <kbd class="kbd">←</kbd><kbd class="kbd">→</kbd> navigate &nbsp;·&nbsp;
          <kbd class="kbd">A</kbd>–<kbd class="kbd">D</kbd> select &nbsp;·&nbsp;
          <kbd class="kbd">F</kbd> flag
        </div>
        <button class="btn btn-primary" id="btn-next">Next →</button>
      </div>

      <!-- PROGRESS BAR -->
      <div style="margin-top:20px">
        <div class="flex items-center justify-between gap-2 mb-2">
          <span style="font-size:0.78rem;color:var(--text-muted)">Progress</span>
          <span style="font-size:0.78rem;color:var(--text-muted)" id="progress-text">0 / 0</span>
        </div>
        <div class="progress-bar progress-bar-lg"><div class="progress-fill" id="main-progress-bar" style="width:0%"></div></div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="exam-sidebar">
      <!-- Stats -->
      <div class="glass-card-static" style="padding:16px 18px">
        <div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:12px">Status</div>
        <div class="flex gap-3 flex-wrap" style="font-size:0.8rem">
          <div><span id="stat-answered" style="font-weight:800;color:var(--accent-blue)">0</span> <span style="color:var(--text-muted)">Answered</span></div>
          <div><span id="stat-unanswered" style="font-weight:800;color:var(--accent-amber)">0</span> <span style="color:var(--text-muted)">Unanswered</span></div>
          <div><span id="stat-flagged" style="font-weight:800;color:#fbbf24">0</span> <span style="color:var(--text-muted)">Flagged</span></div>
        </div>
      </div>

      <!-- Question palette -->
      <div class="glass-card-static" style="padding:16px 18px">
        <div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:10px">Questions</div>
        <div class="question-palette" id="question-palette"></div>
        <div style="margin-top:10px;font-size:0.72rem;color:var(--text-muted)">
          <span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px">
            <span style="width:10px;height:10px;border-radius:2px;background:rgba(59,130,246,0.4);display:inline-block"></span> Answered
          </span>
          <span style="display:inline-flex;align-items:center;gap:4px">
            <span style="width:10px;height:10px;border-radius:2px;background:rgba(245,158,11,0.4);display:inline-block"></span> Flagged
          </span>
        </div>
      </div>

      <!-- Submit button -->
      <button class="btn btn-success w-full btn-lg" id="btn-submit-sidebar">
        ✅ Submit Exam
      </button>

      <!-- Autosave indicator -->
      <div style="text-align:center;font-size:0.75rem;color:var(--text-muted)" id="autosave-indicator">
        Draft auto-saved
      </div>
    </div>
  </div>

  <!-- ─── REVIEW MODAL ─── -->
  <div id="review-modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:600px">
      <h2 class="modal-title">📋 Review Before Submitting</h2>
      <div class="modal-body">
        <div id="review-summary" style="margin-bottom:16px"></div>
        <div id="review-unanswered-list"></div>
        <div id="review-flagged-list"></div>
        <p style="margin-top:16px;padding:12px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:8px;font-size:0.85rem;color:#fbbf24">
          ⚠️ Once submitted, you cannot change your answers.
        </p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btn-review-continue">← Keep Reviewing</button>
        <button class="btn btn-danger" id="btn-confirm-submit">Submit Now</button>
      </div>
    </div>
  </div>

  <!-- ─── LOADING ─── -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-spinner"></div>
    <div style="color:var(--text-muted)">Loading exam…</div>
  </div>

  <script type="module">
    import { loadUser, loadSelectedTrack, loadSelectedExam, saveDraft, loadDraft, clearDraft, saveAttempt, markExamPassed } from './assets/storage.js';
    import { getExamById } from './data/exams.js';
    import { getTrackById } from './data/tracks.js';
    import { prepareExamQuestions, formatTime, buildAttemptRecord, getUnansweredIndices } from './assets/exam-engine.js';
    import { renderQuestion, showToast, getTimerClass } from './assets/ui.js';
    import { goHome, goToResults, getQueryParam } from './assets/router.js';
    import { initParticles, createTimerRing } from './assets/animations.js';
    import { submitAttempt } from './assets/supabase-client.js';

    // ─── State ────────────────────────────────────────────
    let exam, track, user, questions;
    let currentIndex  = 0;
    let answers       = {};
    let flagged       = new Set();
    let startedAt     = null;
    let timerInterval = null;
    let remainingSeconds = 0;
    let totalSeconds     = 0;
    let timerRing        = null;
    let isSubmitting     = false;

    // ─── Init ─────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      initParticles('particles-canvas');

      const trackId = getQueryParam('trackId') || loadSelectedTrack();
      const examId  = getQueryParam('examId')  || loadSelectedExam();

      user  = loadUser();
      exam  = getExamById(examId);
      track = getTrackById(trackId);

      if (!exam || !track) {
        showToast('Invalid exam. Returning home.', 'error');
        setTimeout(goHome, 2000);
        return;
      }

      if (!user?.name) {
        showToast('Please enter your name on the home page first.', 'warning');
        setTimeout(goHome, 2000);
        return;
      }

      questions = prepareExamQuestions(exam.id);
      if (!questions.length) {
        showToast('No questions found for this exam.', 'error');
        setTimeout(goHome, 2000);
        return;
      }

      // Try restore draft
      const draft = loadDraft(exam.id);
      if (draft && draft.answers && confirm('Resume your saved draft attempt?')) {
        answers  = draft.answers || {};
        flagged  = new Set(draft.flagged || []);
        startedAt = draft.startedAt || new Date().toISOString();
        remainingSeconds = draft.remainingSeconds ?? exam.durationMinutes * 60;
        currentIndex = draft.currentIndex || 0;
      } else {
        clearDraft(exam.id);
        startedAt = new Date().toISOString();
        remainingSeconds = exam.durationMinutes * 60;
      }

      totalSeconds = exam.durationMinutes * 60;

      // Update header
      document.getElementById('hdr-exam-title').textContent = exam.title;
      document.getElementById('hdr-exam-meta').textContent  =
        `${user.name} · ${track.title} · ${exam.durationMinutes} min · ${exam.passingScore}% to pass`;

      // Show layout
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('exam-layout').style.display    = '';

      // Timer ring
      timerRing = createTimerRing(document.getElementById('timer-ring-container'), totalSeconds);

      renderCurrentQuestion();
      updatePalette();
      updateStats();
      startTimer();
      bindEvents();
      setupKeyboard();

      // Autosave every 30s
      setInterval(autoSave, 30000);
    });

    // ─── Timer ────────────────────────────────────────────
    function startTimer() {
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateTimerDisplay();
        if (timerRing) timerRing.update(remainingSeconds);
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          showToast('⏰ Time is up! Submitting automatically…', 'warning', 5000);
          setTimeout(doSubmit, 1500);
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const el = document.getElementById('timer-display');
      el.textContent = formatTime(remainingSeconds);
      el.className   = `timer-display ${getTimerClass(remainingSeconds, totalSeconds)}`;
    }

    // ─── Render question ──────────────────────────────────
    function renderCurrentQuestion() {
      const container = document.getElementById('question-container');
      const q         = questions[currentIndex];
      const selected  = answers[currentIndex] ?? null;

      container.innerHTML = '';
      const qCard = renderQuestion(q, currentIndex, questions.length, selected);
      container.appendChild(qCard);

      qCard.addEventListener('answer-selected', (e) => {
        answers[currentIndex] = e.detail.index;
        updatePalette();
        updateStats();
        updateProgress();
        autoSave();
      });

      updateProgress();
      updateNavButtons();
      updateHeaderProgress();
    }

    function updateProgress() {
      const answered = Object.values(answers).filter((v) => v !== null && v !== undefined).length;
      const pct      = Math.round((answered / questions.length) * 100);
      document.getElementById('main-progress-bar').style.width = pct + '%';
      document.getElementById('progress-text').textContent = `${answered} / ${questions.length}`;
    }

    function updateHeaderProgress() {
      document.getElementById('hdr-progress').textContent =
        `Q ${currentIndex + 1} / ${questions.length}`;
    }

    function updateNavButtons() {
      document.getElementById('btn-prev').disabled = currentIndex === 0;
      const nextBtn = document.getElementById('btn-next');
      nextBtn.textContent = currentIndex === questions.length - 1 ? 'Review & Submit →' : 'Next →';
    }

    function updatePalette() {
      const palette = document.getElementById('question-palette');
      palette.innerHTML = '';
      questions.forEach((_, i) => {
        const item = document.createElement('div');
        item.className = 'palette-item';
        item.textContent = i + 1;
        if (i === currentIndex) item.classList.add('current');
        if (answers[i] !== undefined && answers[i] !== null) item.classList.add('answered');
        if (flagged.has(i)) item.classList.add('flagged');
        item.addEventListener('click', () => { currentIndex = i; renderCurrentQuestion(); updatePalette(); });
        palette.appendChild(item);
      });
    }

    function updateStats() {
      const answered   = Object.values(answers).filter((v) => v !== null && v !== undefined).length;
      const unanswered = questions.length - answered;
      document.getElementById('stat-answered').textContent   = answered;
      document.getElementById('stat-unanswered').textContent = unanswered;
      document.getElementById('stat-flagged').textContent    = flagged.size;
    }

    // ─── Autosave ─────────────────────────────────────────
    function autoSave() {
      saveDraft(exam.id, {
        answers: { ...answers },
        flagged: Array.from(flagged),
        startedAt,
        remainingSeconds,
        currentIndex,
        savedAt: new Date().toISOString(),
      });
      const el = document.getElementById('autosave-indicator');
      el.textContent = `Saved ${new Date().toLocaleTimeString()}`;
    }

    // ─── Submit ───────────────────────────────────────────
    function openReviewModal() {
      const unanswered = getUnansweredIndices(questions, answers);
      const flaggedArr = Array.from(flagged);
      const answered   = questions.length - unanswered.length;

      const summaryEl = document.getElementById('review-summary');
      summaryEl.innerHTML = `
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);gap:10px">
          <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value">${answered}</div><div class="stat-label">Answered</div></div>
          <div class="stat-card"><div class="stat-icon">❓</div><div class="stat-value" style="color:var(--accent-amber)">${unanswered.length}</div><div class="stat-label">Unanswered</div></div>
          <div class="stat-card"><div class="stat-icon">🚩</div><div class="stat-value" style="color:#fbbf24">${flaggedArr.length}</div><div class="stat-label">Flagged</div></div>
        </div>
      `;

      const unansweredEl = document.getElementById('review-unanswered-list');
      unansweredEl.innerHTML = unanswered.length
        ? `<p style="margin:12px 0 6px;font-size:0.85rem;color:var(--accent-amber)">⚠️ Unanswered: Q${unanswered.map((i) => i + 1).join(', Q')}</p>`
        : `<p style="margin:12px 0 6px;font-size:0.85rem;color:var(--accent-emerald)">✅ All questions answered</p>`;

      const flaggedEl = document.getElementById('review-flagged-list');
      flaggedEl.innerHTML = flaggedArr.length
        ? `<p style="font-size:0.85rem;color:#fbbf24">🚩 Flagged for review: Q${flaggedArr.map((i) => i + 1).join(', Q')}</p>`
        : '';

      document.getElementById('review-modal').classList.remove('hidden');
    }

    async function doSubmit() {
      if (isSubmitting) return;
      isSubmitting = true;
      clearInterval(timerInterval);

      document.getElementById('review-modal').classList.add('hidden');
      showToast('Submitting exam…', 'info', 4000);

      const submittedAt = new Date().toISOString();
      const attempt = buildAttemptRecord({
        user, exam, track, questions, answers: { ...answers },
        startedAt, submittedAt, flagged: Array.from(flagged),
      });

      // Save locally first (always reliable)
      saveAttempt(attempt);

      // Mark passed in progress
      if (attempt.passed) {
        markExamPassed(user.name, exam.id, track.id, attempt.percentage);
      }

      clearDraft(exam.id);

      // Try Supabase (non-blocking)
      submitAttempt(attempt).catch(() => {});

      // Navigate to results
      import('./assets/router.js').then(({ goToResults }) => goToResults(exam.id));
    }

    // ─── Events ───────────────────────────────────────────
    function bindEvents() {
      document.getElementById('btn-prev').addEventListener('click', () => {
        if (currentIndex > 0) { currentIndex--; renderCurrentQuestion(); updatePalette(); }
      });
      document.getElementById('btn-next').addEventListener('click', () => {
        if (currentIndex < questions.length - 1) {
          currentIndex++;
          renderCurrentQuestion();
          updatePalette();
        } else {
          openReviewModal();
        }
      });
      document.getElementById('btn-flag').addEventListener('click', () => {
        if (flagged.has(currentIndex)) { flagged.delete(currentIndex); showToast('Flag removed', 'info', 1500); }
        else { flagged.add(currentIndex); showToast('Question flagged for review', 'warning', 1500); }
        updatePalette();
        updateStats();
      });
      document.getElementById('btn-clear').addEventListener('click', () => {
        delete answers[currentIndex];
        renderCurrentQuestion();
        updatePalette();
        updateStats();
        updateProgress();
      });
      document.getElementById('btn-submit-top').addEventListener('click', openReviewModal);
      document.getElementById('btn-submit-sidebar').addEventListener('click', openReviewModal);
      document.getElementById('btn-review-continue').addEventListener('click', () => {
        document.getElementById('review-modal').classList.add('hidden');
      });
      document.getElementById('btn-confirm-submit').addEventListener('click', doSubmit);
      document.getElementById('btn-exit').addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm('Exit exam? Your draft will be saved automatically.')) {
          autoSave();
          goHome();
        }
      });
    }

    // ─── Keyboard shortcuts ───────────────────────────────
    function setupKeyboard() {
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const keyMap = { a:0, b:1, c:2, d:3, A:0, B:1, C:2, D:3, '1':0, '2':1, '3':2, '4':3 };
        if (e.key in keyMap) {
          const idx = keyMap[e.key];
          const q   = questions[currentIndex];
          if (idx < q.choices.length) {
            answers[currentIndex] = idx;
            renderCurrentQuestion();
            updatePalette();
            updateStats();
            updateProgress();
          }
        } else if (e.key === 'ArrowRight' && currentIndex < questions.length - 1) {
          currentIndex++; renderCurrentQuestion(); updatePalette();
        } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
          currentIndex--; renderCurrentQuestion(); updatePalette();
        } else if (e.key === 'f' || e.key === 'F') {
          if (flagged.has(currentIndex)) flagged.delete(currentIndex);
          else flagged.add(currentIndex);
          updatePalette(); updateStats();
        } else if (e.key === 'Enter' || e.key === ' ') {
          if (currentIndex < questions.length - 1) { currentIndex++; renderCurrentQuestion(); updatePalette(); }
          else openReviewModal();
        }
      });
    }
  </script>
</body>
</html>
